name: publish-image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The upstream CPU image unpacks to roughly eight gigabytes. The image is built once, tested,
      # and then pushed; building it twice would not fit on the runner.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Static checks
        run: tests/static.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=whisper-asr-railway
            org.opencontainers.image.description=Community Railway wrapper for Whisper ASR Webservice, a self-hosted speech-to-text API. Adds authentication. Not affiliated with the upstream project.
            org.opencontainers.image.licenses=MIT

      - name: Resolve wrapper version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Railway runs amd64. The upstream CPU image is multi-arch, but pulling and pushing a second
      # eight-gigabyte architecture does not fit in a runner's disk, so this publishes amd64 only.
      - name: Build candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            whisper-asr-railway:candidate
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WRAPPER_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          provenance: false

      - name: Smoke tests against candidate
        env:
          WHISPER_ASR_RAILWAY_IMAGE: whisper-asr-railway:candidate
        run: tests/smoke.sh

      - name: Persistence tests against candidate
        env:
          WHISPER_ASR_RAILWAY_IMAGE: whisper-asr-railway:candidate
        run: tests/persistence.sh

      - name: Tear down test stack
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Push the tested image
        id: push
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pushing $tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          first=$(head -1 <<< "${{ steps.meta.outputs.tags }}")
          digest=$(docker buildx imagetools inspect "$first" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Report digest
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags: ${{ steps.meta.outputs.tags }}" | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
