# Local test topology. Mirrors the Railway deployment: one public service, one volume.
name: whisper-asr-railway-test

services:
  whisper:
    # Built from this repository. CI and the Railway template use the published GHCR image instead.
    build:
      context: .
      args:
        WRAPPER_VERSION: ${WRAPPER_VERSION:-0.0.0-local}
        VCS_REF: ${VCS_REF:-local}
    image: ${WHISPER_ASR_RAILWAY_IMAGE:-whisper-asr-railway:local}
    restart: unless-stopped
    environment:
      PORT: '8000'
      WHISPER_AUTH_USERNAME: admin
      WHISPER_AUTH_PASSWORD: local-test-only-whisper-password
      ASR_MODEL: tiny
      TZ: UTC
    volumes:
      - cache:/root/.cache
    ports:
      - '127.0.0.1:8000:8000'

volumes:
  cache:
